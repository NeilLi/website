<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="seedcoreTitle seedcoreDesc">
  <title id="seedcoreTitle">SeedCore logo</title>
  <desc id="seedcoreDesc">Simplified geometric S-ribbon mark with linked physical AI trust nodes</desc>
  <defs>
    <linearGradient id="bgGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#132338" />
      <stop offset="100%" stop-color="#08111f" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="upperRibbon" x1="44" y1="14" x2="18" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="55%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="lowerRibbon" x1="20" y1="30" x2="46" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Clean rounded hardware tile base -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />
  <rect x="8" y="8" width="48" height="48" rx="10" stroke="#1e344d" stroke-width="1" stroke-dasharray="3 3" opacity="0.65" />

  <!-- Subtle S-ribbon shadow for tactile depth -->
  <path d="M42 18H26.5C21.25 18 17 22.25 17 27.5C17 32.75 21.25 37 26.5 37H37.5C42.75 37 47 41.25 47 46.5C47 51.75 42.75 56 37.5 56H22" transform="translate(0, -3)" stroke="#040912" stroke-width="9" stroke-linecap="round" opacity="0.55" />

  <!-- Upper S-Ribbon (Emerald to Cyan) -->
  <path d="M43 16H26.5C21.5 16 17.5 20 17.5 25C17.5 30 21.5 34 26.5 34H37.5" stroke="url(#upperRibbon)" stroke-width="7.5" stroke-linecap="round" />

  <!-- Lower S-Ribbon (Cyan to Violet) -->
  <path d="M26.5 30H37.5C42.5 30 46.5 34 46.5 39C46.5 44 42.5 48 37.5 48H21" stroke="url(#lowerRibbon)" stroke-width="7.5" stroke-linecap="round" />

  <!-- Crisp center overlap highlight -->
  <circle cx="32" cy="32" r="4.2" fill="#0b1628" stroke="#60dce0" stroke-width="2.2" />

  <!-- Terminal hardware nodes (Top-Right Mint & Bottom-Left Violet/Cyan) -->
  <circle cx="43" cy="16" r="5" fill="#0b1628" stroke="#4ade80" stroke-width="2.8" />
  <circle cx="43" cy="16" r="1.8" fill="#86efac" />

  <circle cx="21" cy="48" r="5" fill="#0b1628" stroke="#a855f7" stroke-width="2.8" />
  <circle cx="21" cy="48" r="1.8" fill="#d8b4fe" />
</svg>
