<svg width="960" height="280" viewBox="0 0 960 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seedcoreTitle seedcoreDesc">
  <title id="seedcoreTitle">SeedCore logo</title>
  <desc id="seedcoreDesc">Simplified geometric S-ribbon mark with SeedCore wordmark and subtitle</desc>
  <defs>
    <linearGradient id="bgGrad" x1="56" y1="48" x2="216" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#132338" />
      <stop offset="100%" stop-color="#08111f" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="48" y1="48" x2="224" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="upperRibbon" x1="176" y1="84" x2="92" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="55%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="lowerRibbon" x1="96" y1="136" x2="184" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <rect width="960" height="280" fill="transparent" />

  <!-- Icon Tile -->
  <g transform="translate(44, 44)">
    <rect x="0" y="0" width="192" height="192" rx="44" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />
    <rect x="14" y="14" width="164" height="164" rx="32" stroke="#1e344d" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.65" />

    <!-- Ribbon Shadow -->
    <path d="M132 50H80C62 50 48 64 48 82C48 100 62 114 80 114H116C134 114 148 128 148 146C148 164 134 178 116 178H64" transform="translate(0, -10)" stroke="#040912" stroke-width="26" stroke-linecap="round" opacity="0.55" />

    <!-- Upper S-Ribbon -->
    <path d="M134 44H80C63 44 49 58 49 75C49 92 63 106 80 106H116" stroke="url(#upperRibbon)" stroke-width="22" stroke-linecap="round" />

    <!-- Lower S-Ribbon -->
    <path d="M80 92H116C133 92 147 106 147 123C147 140 133 154 116 154H62" stroke="url(#lowerRibbon)" stroke-width="22" stroke-linecap="round" />

    <!-- Center Joint Node -->
    <circle cx="98" cy="99" r="12" fill="#0b1628" stroke="#60dce0" stroke-width="6" />

    <!-- Terminal Nodes -->
    <circle cx="134" cy="44" r="15" fill="#0b1628" stroke="#4ade80" stroke-width="8" />
    <circle cx="134" cy="44" r="5.5" fill="#86efac" />

    <circle cx="62" cy="154" r="15" fill="#0b1628" stroke="#a855f7" stroke-width="8" />
    <circle cx="62" cy="154" r="5.5" fill="#d8b4fe" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(272, 0)">
    <text x="0" y="148"
      font-family="'Avenir Next', 'SF Pro Display', Inter, 'Segoe UI', Arial, sans-serif"
      font-size="84"
      font-weight="750"
      letter-spacing="0.5"
      fill="#EDF4FC">SEED</text>
    <text x="234" y="148"
      font-family="'Avenir Next', 'SF Pro Display', Inter, 'Segoe UI', Arial, sans-serif"
      font-size="84"
      font-weight="350"
      letter-spacing="0.5"
      fill="#60DCE0">CORE</text>

    <text x="4" y="190"
      font-family="'SFMono-Regular', Consolas, monospace"
      font-size="15"
      font-weight="600"
      letter-spacing="4"
      fill="#9BAEC2">MINI COMPONENTS &amp; TRUST RUNTIME</text>
  </g>
</svg>
